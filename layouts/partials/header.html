{{ $items := site.Data.navigation.header }}
{{ $current := .RelPermalink }}

<header class="header">
  <div class="container header-inner">
    <div class="brand">
      <a class="brand-link" href="/">{{ site.Params.brand | default site.Title }}</a>
    </div>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
      <span class="nav-toggle-label">Menu</span>
    </button>

    <nav id="site-nav" class="nav" aria-label="Primary">
      <ul class="nav-list">
        {{ range $items }}
          {{ $url := .url }}
          {{ $active := or (eq $current $url) (and (ne $url "/") (hasPrefix $current $url)) }}
          <li class="nav-item">
            <a class="nav-link {{ if $active }}is-active{{ end }}" href="{{ $url }}">{{ .name }}</a>
          </li>
        {{ end }}
        <li class="nav-item">
          <button class="theme-toggle" type="button" aria-label="Toggle theme" data-theme-toggle>
            <!-- Sun icon (shown in dark mode, click to switch to light) -->
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon icon (shown in light mode, click to switch to dark) -->
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>
