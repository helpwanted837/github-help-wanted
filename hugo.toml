baseURL = "https://github-help-wanted.com/"
languageCode = "en"
title = "GitHub Help Wanted"
summaryLength = 30
# RSS 描述摘要最大字符数（用于 Telegram/Telegraph 分发的 excerpt）
rssDescriptionMaxChars = 1200
# RSS content:encoded 最大字符数（0 表示不输出）
rssContentMaxChars = 4000

# PBN 必配：未来内容不提前构建（配合定时 Actions 做“自动发布”）
buildFuture = false

# 只保留我们需要的页面类型，避免生成无用的 taxonomy 页面
disableKinds = ["taxonomy", "term"]

enableRobotsTXT = true

[params]
brand = "GitHub Help Wanted"
tagline = "Your Guide to Developer Success"
description = "Guides for open source contribution, DevOps, testing, CI/CD, and product management—checklists, tool comparisons, and workflows to help developers ship."
email = "hello@github-help-wanted.com"
defaultOGImage = "/og/site-default.jpg"

  [params.organization]
  name = "GitHub Help Wanted"
  logo = "/og/site-default.jpg"
  email = "hello@github-help-wanted.com"

  # Umami Analytics (via Cloudflare Worker proxy)
  # 1. 在 Umami 后台 (umami.hniapi.top) 添加站点，获取 websiteId
  # 2. 部署 Worker: cd workers/umami-proxy && npx wrangler deploy
  # 3. 将 enabled 改为 true
  [params.umami]
  enabled = true
  websiteId = "f9fb89b2-9e0a-4af9-884e-858758847fc6"

[pagination]
pagerSize = 10
disableAliases = true

[outputs]
home = ["HTML", "RSS", "Sitemap"]
section = ["HTML"]
page = ["HTML"]

[outputFormats.Sitemap]
mediaType = "application/xml"
baseName = "sitemap"
isPlainText = true
rel = "sitemap"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
