name: External Link Health Check

on:
  workflow_dispatch:
  schedule:
    # Weekly (UTC). Keep this different from other repos for PBN isolation.
    - cron: "47 5 * * 2"

concurrency:
  group: github-help-wanted-external-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run external link check
        run: |
          python scripts/check_external_links.py \
            --max-workers 8 \
            --timeout 12 \
            --retries 1 \
            --output .cache/external_links/report.json

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-links-report
          path: .cache/external_links/report.json

      - name: Write summary
        if: always()
        run: |
          python -c '
          import json
          from pathlib import Path

          path = Path(".cache/external_links/report.json")
          if not path.exists():
              print("Report missing: .cache/external_links/report.json")
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          total = data.get("total_urls", 0)
          ok = data.get("ok", 0)
          redirects = data.get("redirects", 0)
          hard_fail = data.get("hard_fail", 0)
          soft_fail = data.get("soft_fail", 0)

          print("## External Link Health Check")
          print(f"- Total: {total}")
          print(f"- OK: {ok}")
          print(f"- Redirects: {redirects}")
          print(f"- Hard fail (404/410): {hard_fail}")
          print(f"- Soft fail: {soft_fail}")
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set. Skipping Telegram notification."
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="External link check failed\nRepo: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nRun: ${RUN_URL}"

          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            >/dev/null || true

