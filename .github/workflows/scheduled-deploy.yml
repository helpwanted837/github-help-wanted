name: Scheduled Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # 每天1次（UTC 06:17 = 北京 14:17）

concurrency:
  group: github-help-wanted-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide deploy (scheduled only)
        if: github.event_name == 'schedule'
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r scripts/requirements.txt
          result=$(python scripts/decide_deploy.py --workflow-file scheduled-deploy.yml)
          echo "should_deploy=$result" >> $GITHUB_OUTPUT

      - name: Random delay (jitter)
        if: github.event_name == 'schedule' && steps.check.outputs.should_deploy == 'true'
        run: sleep $((RANDOM % 900)) # 0-15 分钟随机延迟

      - name: Setup Hugo
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Node (for Pagefind)
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore internal link state cache
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/internal_links
          key: internal-links-state-ghw-v1
          restore-keys: |
            internal-links-state-ghw-
            internal-links-state-

      - name: Restore OG image cache
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/og_images
            static/og
          key: og-images-cache-v1
          restore-keys: |
            og-images-cache-

      - name: Generate internal links
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        run: |
          pip install -r scripts/requirements.txt
          python scripts/generate_internal_links.py --incremental

      - name: Generate OG images
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        run: |
          python scripts/generate_og_images.py

      - name: Build
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        run: hugo --minify --gc

      - name: Build search index (Pagefind)
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        run: npx -y pagefind --site public --output-subdir pagefind --force-language en --exclude-selectors "pre, table"

      - name: SEO sanity checks (offline)
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        run: |
          python scripts/audit_seo.py --public public

      - name: Check internal links (built output)
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        run: |
          pip install -r scripts/requirements.txt
          python scripts/check_internal_links.py --public public

      - name: Sitemap sanity checks
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail

          if [ ! -f public/sitemap.xml ]; then
            echo "::error::Missing public/sitemap.xml"
            exit 1
          fi

          # Hugo 可能把 sitemap.xml 压成一行，因此用“出现次数”而不是行数判断。
          head -c 5 public/sitemap.xml | grep -q "<?xml" || { echo "::error::sitemap.xml missing XML header"; exit 1; }
          grep -q "<urlset" public/sitemap.xml || { echo "::error::sitemap.xml missing <urlset>"; exit 1; }
          if grep -q "&lt;\\?xml" public/sitemap.xml; then
            echo "::error::sitemap.xml is HTML-escaped (check outputFormats.Sitemap.isPlainText)"
            exit 1
          fi

          URL_COUNT=$(grep -o "<url>" public/sitemap.xml | wc -l | tr -d ' ')
          if [ "${URL_COUNT:-0}" -lt 5 ]; then
            echo "::error::sitemap.xml has too few URLs (${URL_COUNT:-0})"
            exit 1
          fi

          if grep -q "/p/" public/sitemap.xml; then
            echo "::error::sitemap.xml contains paginated URLs (/p/)"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'schedule' || steps.check.outputs.should_deploy == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: github-help-wanted
          directory: public
          workingDirectory: .
          gitHubToken: ''

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set. Skipping Telegram notification."
            exit 0
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="Workflow failed\nRepo: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nEvent: ${{ github.event_name }}\nRef: ${{ github.ref }}\nRun: ${RUN_URL}"

          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" \
            >/dev/null || true
